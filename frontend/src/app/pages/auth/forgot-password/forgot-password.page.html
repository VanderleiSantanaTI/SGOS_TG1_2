<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login"></ion-back-button>
    </ion-buttons>
    <ion-title>Recuperar Senha</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="forgot-password-container">
    <div class="header-section">
      <ion-icon name="mail-outline" class="header-icon"></ion-icon>
      <h1>Esqueceu sua senha?</h1>
      <p>Digite seu email para receber o código de recuperação</p>
    </div>

    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
      <ion-item fill="outline" [class]="getEmailItemClass()">
        <ion-label position="stacked">Email</ion-label>
        <ion-input 
          formControlName="email"
          type="email"
          placeholder="Digite seu email">
        </ion-input>
        <ion-icon 
          *ngIf="checkingEmail" 
          name="hourglass-outline" 
          slot="end" 
          class="checking-icon">
        </ion-icon>
        <ion-icon 
          *ngIf="emailChecked && emailExists" 
          name="checkmark-circle" 
          slot="end" 
          class="success-icon">
        </ion-icon>
        <ion-icon 
          *ngIf="emailChecked && !emailExists" 
          name="close-circle" 
          slot="end" 
          class="error-icon">
        </ion-icon>
      </ion-item>

      <!-- Feedback de verificação de email -->
      <div class="email-feedback" *ngIf="emailChecked">
        <div class="success-message" *ngIf="emailExists">
          <ion-icon name="checkmark-circle"></ion-icon>
          <span>Email encontrado! Você pode solicitar a recuperação de senha.</span>
        </div>
        <div class="error-message" *ngIf="!emailExists">
          <ion-icon name="close-circle"></ion-icon>
          <span>Email não encontrado em nossa base de dados.</span>
        </div>
      </div>

      <ion-button 
        type="submit"
        expand="block"
        [disabled]="loading || forgotPasswordForm.invalid || !emailChecked || !emailExists"
        class="submit-button">
        <ion-spinner *ngIf="loading" name="crescent" slot="start"></ion-spinner>
        {{ loading ? 'Enviando...' : 'Enviar Código' }}
      </ion-button>
    </form>

    <div class="footer-actions">
      <ion-button fill="clear" type="button" (click)="goToLogin()">
        Voltar ao Login
      </ion-button>
    </div>
  </div>
</ion-content>
